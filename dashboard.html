<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Diggaj's Scoops 🛒</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🧭 GLOBAL NAVIGATION -->
    <nav class="navbar">
        <div class="logo">🍦 Diggaj's Scoops</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu 😋</a>
            <a href="dashboard.html" class="active">Dashboard 🛒</a>
            <button id="theme-toggle" class="nav-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
            <button id="auth-btn" class="nav-btn" onclick="openAuth()">Login 👤</button>
        </div>
    </nav>

    <!-- 🔐 LOGIN MODAL -->
    <div id="auth-modal">
        <div class="modal-box">
            <h2 id="auth-title">Login 👤</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="modal-btn" onclick="handleAuth()">Submit ✅</button>
            <p class="toggle-link" onclick="toggleAuthMode()">Need an account? Register</p>
            <button class="cancel-btn" onclick="closeModal()">Close ❌</button>
        </div>
    </div>

    <!-- 📊 DASHBOARD VIEW -->
    <section class="page-container">
        <h1 class="page-title">Your Dashboard 👤</h1>
        
        <div class="dashboard-grid">
            <!-- Active Cart -->
            <div class="dash-card">
                <h2>Current Cart 🛍️</h2>
                <ul id="cart-items" class="dash-list">
                    <li style="color: gray;">Your cart is empty. 🥺</li>
                </ul>
                <h3 id="total-price" style="margin: 20px 0; font-size: 1.8rem; color: #d63031;">Total: ₹0</h3>
                <button class="checkout-btn" onclick="placeOrder()">Checkout Now ✅</button>
            </div>

            <!-- Order History -->
            <div class="dash-card">
                <h2>Past Orders 📜</h2>
                <ul id="order-history" class="dash-list">
                    <li style="color: gray;">Login to view your history! 🔒</li>
                </ul>
                <button class="cancel-btn" style="margin-top: 15px;" onclick="logout()">Logout 🚪</button>
            </div>
        </div>
    </section>

    <!-- 👨‍💻 FOOTER -->
    <footer style="text-align: center; padding: 30px; border-top: 1px solid var(--border-color); margin-top: 50px;">
        <p>👨‍💻 Zeal College Mini-Project developed by Diggaj</p>
    </footer>

    <!-- ⚙️ SHARED SCRIPTS -->
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="cart.js"></script>
</body>
</html>
